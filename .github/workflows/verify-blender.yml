name: Verify Blender artifact

on:
  push:
    branches: [main]
    paths:
      - apps/blender/**
      - policy/approved-sources.yaml
      - .github/workflows/verify-blender.yml
  pull_request:
    paths:
      - apps/blender/**
      - policy/approved-sources.yaml
      - .github/workflows/verify-blender.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: registry

      - name: Check out TarLink extractor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink
          ref: main
          path: tarlink

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: registry/go.mod
          cache: false

      - name: Download and verify declared bytes
        working-directory: registry
        env:
          TARLINK_VERIFY_BLENDER_OUTPUT: /tmp/tarlink-blender.tar.xz
        run: go test -count=1 -run '^TestBlenderArtifact$' -v ./internal/validator

      - name: Safe-extract and verify executable
        working-directory: tarlink
        env:
          TARLINK_UPSTREAM_BLENDER_ARCHIVE: /tmp/tarlink-blender.tar.xz
        run: go test -count=1 -run '^TestBlenderUpstreamArchiveCompatibility$' -v ./internal/archive
