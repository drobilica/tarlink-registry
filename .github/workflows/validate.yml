name: Validate

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: Optional application ID to materialize
        required: false
        type: string
      full:
        description: Materialize every registry artifact
        required: false
        default: false
        type: boolean

jobs:
  resolve-tarlink:
    name: Resolve latest stable TarLink
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(gh api repos/drobilica/tarlink/releases/latest --jq .tag_name)
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "latest TarLink release is not stable: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  structural:
    needs: resolve-tarlink
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified released TarLink
        env:
          GH_TOKEN: ${{ github.token }}
          TARLINK_TAG: ${{ needs.resolve-tarlink.outputs.tag }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/tarlink-release"
          mkdir -p "$release_dir"
          gh release download "$TARLINK_TAG" --repo drobilica/tarlink \
            --pattern checksums.txt --pattern tarlink-linux-amd64 --dir "$release_dir"
          matches=$(awk '$2 == "tarlink-linux-amd64" { count++ } END { print count + 0 }' "$release_dir/checksums.txt")
          test "$matches" -eq 1
          expected=$(awk '$2 == "tarlink-linux-amd64" { print $1 }' "$release_dir/checksums.txt")
          actual=$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{ print $1 }')
          test "$actual" = "$expected"
          chmod 0755 "$release_dir/tarlink-linux-amd64"
          echo "TARLINK_BINARY=$release_dir/tarlink-linux-amd64" >> "$GITHUB_ENV"

      - name: Validate manifests with TarLink
        run: |
          "$TARLINK_BINARY" registry validate "$GITHUB_WORKSPACE"

  artifacts:
    needs: [resolve-tarlink, structural]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out registry history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified released TarLink
        env:
          GH_TOKEN: ${{ github.token }}
          TARLINK_TAG: ${{ needs.resolve-tarlink.outputs.tag }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/tarlink-release"
          mkdir -p "$release_dir"
          gh release download "$TARLINK_TAG" --repo drobilica/tarlink \
            --pattern checksums.txt --pattern tarlink-linux-amd64 --dir "$release_dir"
          matches=$(awk '$2 == "tarlink-linux-amd64" { count++ } END { print count + 0 }' "$release_dir/checksums.txt")
          test "$matches" -eq 1
          expected=$(awk '$2 == "tarlink-linux-amd64" { print $1 }' "$release_dir/checksums.txt")
          actual=$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{ print $1 }')
          test "$actual" = "$expected"
          chmod 0755 "$release_dir/tarlink-linux-amd64"
          echo "TARLINK_BINARY=$release_dir/tarlink-linux-amd64" >> "$GITHUB_ENV"

      - name: Materialize selected artifacts
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          V5_CUTOVER_BOOTSTRAP: ${{ github.event_name == 'pull_request' && github.head_ref == 'manifest-v5-review' && 'true' || 'false' }}
          REQUESTED_APP: ${{ inputs.app }}
          FULL_AUDIT: ${{ inputs.full }}
        run: |
          if [ "$FULL_AUDIT" = true ]; then
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --all-artifacts
          elif [ -n "$REQUESTED_APP" ]; then
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --app "$REQUESTED_APP"
          # One-time reviewed v5 cutover: its v4 base must not be parsed by the strict v5 validator.
          elif [ "$V5_CUTOVER_BOOTSTRAP" = true ]; then
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --all-artifacts
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            old_root="$RUNNER_TEMP/previous-registry"
            mkdir -p "$old_root"
            git archive "$BASE_SHA" apps | tar -x -C "$old_root"
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --old-root "$old_root"
          else
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE"
          fi
