name: Validate

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: Optional application ID to materialize
        required: false
        type: string
      full:
        description: Materialize every registry artifact
        required: false
        default: false
        type: boolean

jobs:
  resolve-tarlink:
    name: Resolve latest stable TarLink
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      checksums_id: ${{ steps.release.outputs.checksums_id }}
      checksums_digest: ${{ steps.release.outputs.checksums_digest }}
      binary_id: ${{ steps.release.outputs.binary_id }}
      binary_digest: ${{ steps.release.outputs.binary_digest }}
    steps:
      - name: Resolve release once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$RUNNER_TEMP/tarlink-release.json"
          gh api repos/drobilica/tarlink/releases/latest >"$release_json"
          tag=$(jq -r .tag_name "$release_json")
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "latest TarLink release is not stable: $tag" >&2
            exit 1
          fi
          release_id=$(jq -er '.id | numbers' "$release_json")
          checksums=$(jq -er '([.assets[] | select(.name == "checksums.txt")] | if length == 1 then .[0] | [.id, .digest] | @tsv else error("expected one checksums asset") end)' "$release_json")
          binary=$(jq -er '([.assets[] | select(.name == "tarlink-linux-amd64")] | if length == 1 then .[0] | [.id, .digest] | @tsv else error("expected one amd64 asset") end)' "$release_json")
          checksums_id=${checksums%%$'\t'*}
          checksums_digest=${checksums#*$'\t'}
          binary_id=${binary%%$'\t'*}
          binary_digest=${binary#*$'\t'}
          [[ "$checksums_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$binary_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "checksums_id=$checksums_id" >> "$GITHUB_OUTPUT"
          echo "checksums_digest=$checksums_digest" >> "$GITHUB_OUTPUT"
          echo "binary_id=$binary_id" >> "$GITHUB_OUTPUT"
          echo "binary_digest=$binary_digest" >> "$GITHUB_OUTPUT"

  structural:
    needs: resolve-tarlink
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful release resolution
        run: test "${{ needs.resolve-tarlink.result }}" = success

      - name: Check out registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified released TarLink
        env:
          GH_TOKEN: ${{ github.token }}
          TARLINK_TAG: ${{ needs.resolve-tarlink.outputs.tag }}
          TARLINK_RELEASE_ID: ${{ needs.resolve-tarlink.outputs.release_id }}
          TARLINK_CHECKSUMS_ID: ${{ needs.resolve-tarlink.outputs.checksums_id }}
          TARLINK_CHECKSUMS_DIGEST: ${{ needs.resolve-tarlink.outputs.checksums_digest }}
          TARLINK_BINARY_ID: ${{ needs.resolve-tarlink.outputs.binary_id }}
          TARLINK_BINARY_DIGEST: ${{ needs.resolve-tarlink.outputs.binary_digest }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/tarlink-release"
          mkdir -p "$release_dir"
          release_json="$RUNNER_TEMP/tarlink-release-consumer.json"
          gh api "repos/drobilica/tarlink/releases/$TARLINK_RELEASE_ID" >"$release_json"
          test "$(jq -r .tag_name "$release_json")" = "$TARLINK_TAG"
          test "$(jq -r .id "$release_json")" = "$TARLINK_RELEASE_ID"
          jq -e --arg checksums_id "$TARLINK_CHECKSUMS_ID" --arg checksums_digest "$TARLINK_CHECKSUMS_DIGEST" --arg binary_id "$TARLINK_BINARY_ID" --arg binary_digest "$TARLINK_BINARY_DIGEST" '
            ([.assets[] | select((.id | tostring) == $checksums_id and .name == "checksums.txt" and .digest == $checksums_digest)] | length == 1) and
            ([.assets[] | select((.id | tostring) == $binary_id and .name == "tarlink-linux-amd64" and .digest == $binary_digest)] | length == 1)
          ' "$release_json"
          gh api --header 'Accept: application/octet-stream' "repos/drobilica/tarlink/releases/assets/$TARLINK_CHECKSUMS_ID" >"$release_dir/checksums.txt"
          gh api --header 'Accept: application/octet-stream' "repos/drobilica/tarlink/releases/assets/$TARLINK_BINARY_ID" >"$release_dir/tarlink-linux-amd64"
          test "sha256:$(sha256sum "$release_dir/checksums.txt" | awk '{print $1}')" = "$TARLINK_CHECKSUMS_DIGEST"
          test "sha256:$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{print $1}')" = "$TARLINK_BINARY_DIGEST"
          matches=$(awk '$2 == "tarlink-linux-amd64" { count++ } END { print count + 0 }' "$release_dir/checksums.txt")
          test "$matches" -eq 1
          expected=$(awk '$2 == "tarlink-linux-amd64" { print $1 }' "$release_dir/checksums.txt")
          actual=$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{ print $1 }')
          test "$actual" = "$expected"
          chmod 0755 "$release_dir/tarlink-linux-amd64"
          echo "TARLINK_BINARY=$release_dir/tarlink-linux-amd64" >> "$GITHUB_ENV"

      - name: Validate manifests with TarLink
        run: |
          "$TARLINK_BINARY" registry validate "$GITHUB_WORKSPACE"

  artifacts:
    needs: [resolve-tarlink, structural]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require successful release and structural validation
        run: |
          test "${{ needs.resolve-tarlink.result }}" = success
          test "${{ needs.structural.result }}" = success

      - name: Check out registry history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified released TarLink
        env:
          GH_TOKEN: ${{ github.token }}
          TARLINK_TAG: ${{ needs.resolve-tarlink.outputs.tag }}
          TARLINK_RELEASE_ID: ${{ needs.resolve-tarlink.outputs.release_id }}
          TARLINK_CHECKSUMS_ID: ${{ needs.resolve-tarlink.outputs.checksums_id }}
          TARLINK_CHECKSUMS_DIGEST: ${{ needs.resolve-tarlink.outputs.checksums_digest }}
          TARLINK_BINARY_ID: ${{ needs.resolve-tarlink.outputs.binary_id }}
          TARLINK_BINARY_DIGEST: ${{ needs.resolve-tarlink.outputs.binary_digest }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/tarlink-release"
          mkdir -p "$release_dir"
          release_json="$RUNNER_TEMP/tarlink-release-consumer.json"
          gh api "repos/drobilica/tarlink/releases/$TARLINK_RELEASE_ID" >"$release_json"
          test "$(jq -r .tag_name "$release_json")" = "$TARLINK_TAG"
          test "$(jq -r .id "$release_json")" = "$TARLINK_RELEASE_ID"
          jq -e --arg checksums_id "$TARLINK_CHECKSUMS_ID" --arg checksums_digest "$TARLINK_CHECKSUMS_DIGEST" --arg binary_id "$TARLINK_BINARY_ID" --arg binary_digest "$TARLINK_BINARY_DIGEST" '
            ([.assets[] | select((.id | tostring) == $checksums_id and .name == "checksums.txt" and .digest == $checksums_digest)] | length == 1) and
            ([.assets[] | select((.id | tostring) == $binary_id and .name == "tarlink-linux-amd64" and .digest == $binary_digest)] | length == 1)
          ' "$release_json"
          gh api --header 'Accept: application/octet-stream' "repos/drobilica/tarlink/releases/assets/$TARLINK_CHECKSUMS_ID" >"$release_dir/checksums.txt"
          gh api --header 'Accept: application/octet-stream' "repos/drobilica/tarlink/releases/assets/$TARLINK_BINARY_ID" >"$release_dir/tarlink-linux-amd64"
          test "sha256:$(sha256sum "$release_dir/checksums.txt" | awk '{print $1}')" = "$TARLINK_CHECKSUMS_DIGEST"
          test "sha256:$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{print $1}')" = "$TARLINK_BINARY_DIGEST"
          matches=$(awk '$2 == "tarlink-linux-amd64" { count++ } END { print count + 0 }' "$release_dir/checksums.txt")
          test "$matches" -eq 1
          expected=$(awk '$2 == "tarlink-linux-amd64" { print $1 }' "$release_dir/checksums.txt")
          actual=$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{ print $1 }')
          test "$actual" = "$expected"
          chmod 0755 "$release_dir/tarlink-linux-amd64"
          echo "TARLINK_BINARY=$release_dir/tarlink-linux-amd64" >> "$GITHUB_ENV"

      - name: Materialize selected artifacts
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_APP: ${{ inputs.app }}
          FULL_AUDIT: ${{ inputs.full }}
        run: |
          if [ "$FULL_AUDIT" = true ]; then
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --all-artifacts
          elif [ -n "$REQUESTED_APP" ]; then
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --app "$REQUESTED_APP"
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            old_root="$RUNNER_TEMP/previous-registry"
            mkdir -p "$old_root"
            git archive "$BASE_SHA" apps runtimes | tar -x -C "$old_root"
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --old-root "$old_root"
          else
            "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE"
          fi
