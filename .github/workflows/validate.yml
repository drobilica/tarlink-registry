name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out TarLink validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink
          ref: a434984d3fa7cbf340649eb128ad86b774dd8071
          path: .tarlink

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tarlink/go.mod
          cache-dependency-path: .tarlink/go.sum

      - name: Validate manifests with TarLink
        working-directory: .tarlink
        run: go run ./cmd/tarlink registry validate "$GITHUB_WORKSPACE"
