name: Maintain desktop icons

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: registry-desktop-icons
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out registry main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve latest stable TarLink once
        id: tarlink_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$RUNNER_TEMP/tarlink-release.json"
          gh api repos/drobilica/tarlink/releases/latest >"$release_json"
          tag=$(jq -r .tag_name "$release_json")
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "latest TarLink release is not stable: $tag" >&2
            exit 1
          fi
          release_id=$(jq -er '.id | numbers' "$release_json")
          checksums=$(jq -er '([.assets[] | select(.name == "checksums.txt")] | if length == 1 then .[0] | [.id, .digest] | @tsv else error("expected one checksums asset") end)' "$release_json")
          binary=$(jq -er '([.assets[] | select(.name == "tarlink-linux-amd64")] | if length == 1 then .[0] | [.id, .digest] | @tsv else error("expected one amd64 asset") end)' "$release_json")
          checksums_id=${checksums%%$'\t'*}
          checksums_digest=${checksums#*$'\t'}
          binary_id=${binary%%$'\t'*}
          binary_digest=${binary#*$'\t'}
          [[ "$checksums_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$binary_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "checksums_id=$checksums_id" >> "$GITHUB_OUTPUT"
          echo "checksums_digest=$checksums_digest" >> "$GITHUB_OUTPUT"
          echo "binary_id=$binary_id" >> "$GITHUB_OUTPUT"
          echo "binary_digest=$binary_digest" >> "$GITHUB_OUTPUT"

      - name: Download verified stable TarLink release
        env:
          GH_TOKEN: ${{ github.token }}
          TARLINK_TAG: ${{ steps.tarlink_release.outputs.tag }}
          TARLINK_RELEASE_ID: ${{ steps.tarlink_release.outputs.release_id }}
          TARLINK_CHECKSUMS_ID: ${{ steps.tarlink_release.outputs.checksums_id }}
          TARLINK_CHECKSUMS_DIGEST: ${{ steps.tarlink_release.outputs.checksums_digest }}
          TARLINK_BINARY_ID: ${{ steps.tarlink_release.outputs.binary_id }}
          TARLINK_BINARY_DIGEST: ${{ steps.tarlink_release.outputs.binary_digest }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/tarlink-release"
          mkdir -p "$release_dir"
          release_json="$RUNNER_TEMP/tarlink-release-consumer.json"
          gh api "repos/drobilica/tarlink/releases/$TARLINK_RELEASE_ID" >"$release_json"
          test "$(jq -r .tag_name "$release_json")" = "$TARLINK_TAG"
          test "$(jq -r .id "$release_json")" = "$TARLINK_RELEASE_ID"
          jq -e --arg checksums_id "$TARLINK_CHECKSUMS_ID" --arg checksums_digest "$TARLINK_CHECKSUMS_DIGEST" --arg binary_id "$TARLINK_BINARY_ID" --arg binary_digest "$TARLINK_BINARY_DIGEST" '
            ([.assets[] | select((.id | tostring) == $checksums_id and .name == "checksums.txt" and .digest == $checksums_digest)] | length == 1) and
            ([.assets[] | select((.id | tostring) == $binary_id and .name == "tarlink-linux-amd64" and .digest == $binary_digest)] | length == 1)
          ' "$release_json"
          gh api --header 'Accept: application/octet-stream' "repos/drobilica/tarlink/releases/assets/$TARLINK_CHECKSUMS_ID" >"$release_dir/checksums.txt"
          gh api --header 'Accept: application/octet-stream' "repos/drobilica/tarlink/releases/assets/$TARLINK_BINARY_ID" >"$release_dir/tarlink-linux-amd64"
          test "sha256:$(sha256sum "$release_dir/checksums.txt" | awk '{print $1}')" = "$TARLINK_CHECKSUMS_DIGEST"
          test "sha256:$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{print $1}')" = "$TARLINK_BINARY_DIGEST"
          matches=$(awk '$2 == "tarlink-linux-amd64" { count++ } END { print count + 0 }' "$release_dir/checksums.txt")
          test "$matches" -eq 1
          expected=$(awk '$2 == "tarlink-linux-amd64" { print $1 }' "$release_dir/checksums.txt")
          actual=$(sha256sum "$release_dir/tarlink-linux-amd64" | awk '{ print $1 }')
          test "$actual" = "$expected"
          chmod 0755 "$release_dir/tarlink-linux-amd64"
          echo "TARLINK_BINARY=$release_dir/tarlink-linux-amd64" >> "$GITHUB_ENV"

      - name: Find existing maintenance PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --search 'in:title "verified desktop icons"' --json number --jq 'length')
          echo "exists=$([[ "$count" != 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Repair missing icons
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$TARLINK_BINARY" registry icons "$GITHUB_WORKSPACE" --fix --json > "$RUNNER_TEMP/icon-report.json"

      - name: Detect manifest changes
        if: steps.existing.outputs.exists != 'true'
        id: diff
        run: |
          if git diff --quiet -- apps; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Validate repaired registry
        if: steps.existing.outputs.exists != 'true' && steps.diff.outputs.changed == 'true'
        run: |
          "$TARLINK_BINARY" registry validate "$GITHUB_WORKSPACE"
          old_root="$RUNNER_TEMP/previous-registry"
          mkdir -p "$old_root"
          git archive "$GITHUB_SHA" apps runtimes | tar -x -C "$old_root"
          "$TARLINK_BINARY" registry check "$GITHUB_WORKSPACE" --old-root "$old_root"

      - name: Publish validated maintenance branch
        if: steps.existing.outputs.exists != 'true' && steps.diff.outputs.changed == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/desktop-icons-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add apps
          git diff --cached --quiet && exit 0
          git config user.name tarlink-bot
          git config user.email tarlink-bot@users.noreply.github.com
          git commit -m "maint: repair verified desktop icons"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report maintenance handoff
        if: steps.existing.outputs.exists != 'true' && steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          SHA: ${{ steps.branch.outputs.sha }}
        run: |
          {
            echo '## Desktop-icon maintenance requires review'
            echo
            echo "TarLink repaired and validated the registry. A maintainer must open a pull request from \`$BRANCH\` at \`$SHA\`."
            echo
            echo "[Open pull request](https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1)"
            echo
            echo '### Repair report'
            echo '```json'
            cat "$RUNNER_TEMP/icon-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
